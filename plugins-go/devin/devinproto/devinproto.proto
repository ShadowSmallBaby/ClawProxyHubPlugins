message GetChatMessageRequest {
  optional ExaCodeiumCommonPb_Metadata metadata = 1;
  optional string prompt = 2;
  repeated ExaChatPb_ChatMessagePrompt chat_message_prompts = 3;
  optional string chat_model_uid = 21;
  optional ChatMessageRequestType request_type = 7;
  optional ExaCodeiumCommonPb_CompletionConfiguration configuration = 8;
  repeated ExaChatPb_ChatToolDefinition tools = 10;
  optional bool disable_parallel_tool_calls = 11;
  optional ExaChatPb_ChatToolChoice tool_choice = 12;
  optional ExaCortexPb_CortexTrajectoryReference trajectory_reference = 15;
  optional string cascade_id = 16;
  optional ExaCodeiumCommonPb_ConversationalPlannerMode planner_mode = 20;
  optional string execution_id = 22;
}

message GetChatMessageResponse {
  optional string message_id = 1;
  optional string delta_text = 3;
  optional ExaCodeiumCommonPb_StopReason stop_reason = 5;
  repeated ExaCodeiumCommonPb_ChatToolCall delta_tool_calls = 6;
  optional ExaCodeiumCommonPb_ModelUsageStats usage = 7;
  optional string delta_thinking = 9;
  optional string delta_signature = 10;
  optional bool thinking_redacted = 11;
  optional string actual_model_uid = 23;
}

message GetCascadeModelConfigsRequest {
  optional ExaCodeiumCommonPb_Metadata metadata = 1;
}

message GetCascadeModelConfigsResponse {
  repeated ExaCodeiumCommonPb_ClientModelConfig client_model_configs = 1;
}

message ExaChatPb_ChatMessagePrompt {
  optional string message_id = 1;
  optional ExaCodeiumCommonPb_ChatMessageSource source = 2;
  optional string prompt = 3;
  repeated ExaCodeiumCommonPb_ChatToolCall tool_calls = 6;
  optional string tool_call_id = 7;
  optional bool tool_result_is_error = 9;
  repeated ExaCodeiumCommonPb_ImageData images = 10;
}

message ExaChatPb_ChatToolDefinition {
  optional string name = 1;
  optional string description = 2;
  optional string json_schema_string = 3;
}

message ExaChatPb_ChatToolChoice {
  oneof choice {
    string option_name = 1;
    string tool_name = 2;
  }
}

message ExaCodeiumCommonPb_CompletionConfiguration {
  optional uint64 num_completions = 1;
  optional uint64 max_tokens = 2;
  optional uint64 max_newlines = 3;
  optional double temperature = 5;
  optional uint64 top_k = 7;
  optional double top_p = 8;
}

message ExaCodeiumCommonPb_ModelOrAlias {
  oneof choice {
    string model_uid = 3;
  }
}

message ExaCodeiumCommonPb_Metadata {
  optional string ide_name = 1;
  optional string ide_version = 7;
  optional string extension_name = 12;
  optional string extension_version = 2;
  optional string api_key = 3;
  optional string locale = 4;
  optional string os = 5;
  optional string f = 31;
}

message ExaCodeiumCommonPb_ClientModelConfig {
  optional string label = 1;
  optional ExaCodeiumCommonPb_ModelOrAlias model_or_alias = 2;
  optional string model_uid = 22;
  optional bool disabled = 4;
  optional bool supports_images = 5;
  optional ExaCodeiumCommonPb_ModelProvider provider = 10;
  optional int32 max_tokens = 18;
}

message ExaCodeiumCommonPb_ChatToolCall {
  optional string id = 1;
  optional string name = 2;
  optional string arguments_json = 3;
}

message ExaCodeiumCommonPb_ModelUsageStats {
  optional string model_uid = 9;
  optional uint64 input_tokens = 2;
  optional uint64 output_tokens = 3;
  optional uint64 cache_write_tokens = 4;
  optional uint64 cache_read_tokens = 5;
}

message ExaCodeiumCommonPb_ImageData {
  optional string base64_data = 1;
  optional string mime_type = 2;
}

message ExaCortexPb_CortexTrajectoryReference {
  optional string trajectory_id = 1;
  optional ExaCortexPb_CortexTrajectoryType trajectory_type = 3;
  optional ExaCortexPb_CortexStepType step_type = 4;
}
